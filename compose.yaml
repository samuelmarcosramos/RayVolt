name: rayvolt
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rayvolt}
      POSTGRES_USER: ${POSTGRES_USER:-rayvolt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rayvolt}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rayvolt}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rayvolt}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rayvolt}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started

  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: broker
    depends_on:
      - broker

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
