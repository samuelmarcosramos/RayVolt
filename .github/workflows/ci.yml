name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build, test and SonarCloud quality gate
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=samuelmarcosramos
          -Dsonar.projectKey=samuelmarcosramos_RayVolt
          -Dsonar.qualitygate.wait=true
      - name: Build and test (Dependabot, no secrets)
        if: github.actor == 'dependabot[bot]'
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build -d
      - name: Health check through nginx
        run: curl --fail --retry 20 --retry-all-errors --retry-delay 3 http://localhost:3000/api/health
      - if: always()
        run: docker compose down -v
